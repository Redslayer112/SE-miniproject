name: CI/CD

# CI: every pull request and every push to main runs lint, tests (Windows + Linux) and a package build.
# CD: pushing a version tag (v*) runs the same pipeline, then publishes a GitHub Release with the build.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Stage 1: static checks. Only real errors (syntax errors, undefined names), so style never blocks a merge.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - name: Ruff (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 --output-format github src tests scripts

  # Stage 2a: the full suite on the target platform (SRS: Windows), with coverage and an 80% gate.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]" coverage
      - name: Run tests with coverage
        shell: pwsh
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m coverage run --branch --source=src/tms_sim -m pytest
          $pytestExitCode = $LASTEXITCODE
          Write-Host "PYTEST_PROCESS_EXIT_CODE=$pytestExitCode"
          exit $pytestExitCode
      - name: Coverage gate (fails under 80%)
        run: python -m coverage report --fail-under=80
      - name: Coverage XML and HTML
        if: always()
        run: |
          python -m coverage xml
          python -m coverage html
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  # Stage 2b: the same suite on Linux with Qt offscreen (portability evidence, TMS-NF-004).
  test-linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  # Stage 3: build the package and prove the built wheel works in a clean environment.
  build:
    needs: [lint, test, test-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Smoke test the wheel in a fresh virtual environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -m tms_sim run "$GITHUB_WORKSPACE/tests/data/scenario/small_valid_scenario.json" | tee smoke.txt
          grep -q "completed 30" smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Stage 4 (CD): on a version tag, publish a GitHub Release with the package and the final documents.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Tag must match the package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1; }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            docs/SRS_v1.1.pdf docs/SAD_v1.1.pdf docs/Test_Plan_v1.1.pdf \
            --title "TMS-Sim $GITHUB_REF_NAME" --generate-notes
